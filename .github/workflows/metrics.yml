name: Generate Metrics & Contribution Calendar

on:
  schedule:
    - cron: "0 2 * * *"   # Every day at 2 AM UTC
  workflow_dispatch:        # Run manually anytime
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: talha963
          template: classic
          base: header, activity, community, repositories
          base_indepth: yes
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_languages_sections: most-used
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Karachi
          config_display: large
          config_animations: yes
          output_action: commit
          committer_branch: output
          committer_message: "ci: update metrics [skip ci]"
